<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collab Pickup</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/customer">Collab Pickup</a>
  <div class="nav-user">
    <strong id="who-name"></strong>
    <button class="secondary small" id="logout">Log out</button>
  </div>
</header>

<main class="page">
  <div id="result" class="hidden"></div>

  <div class="shop">
    <section>
      <div class="section-head"><h2>Menu</h2></div>
      <div class="menu-grid" id="menu"></div>
    </section>

    <aside class="card sticky">
      <h2>Your order</h2>
      <ul class="cart-lines" id="cart-lines"></ul>
      <div class="cart-total"><span>Total</span><span id="cart-total">CAD 0.00</span></div>
      <div class="cart-actions">
        <button id="place">Place order</button>
        <button class="secondary" id="clear">Clear</button>
      </div>
    </aside>
  </div>

  <div class="section-head"><h2>My orders</h2></div>
  <div class="orders" id="orders"></div>
</main>

<script src="/static/api.js"></script>
<script src="/static/customer.js"></script>
</body>
</html>
