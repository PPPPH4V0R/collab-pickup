<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collab Pickup · Sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/customer">Collab Pickup</a>
</header>

<main class="auth-wrap">
  <div class="card auth-card">
    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" class="active">Log in</button>
      <button type="button" id="tab-signup">Sign up</button>
    </div>

    <div id="alert" class="hidden"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password">
      </div>
      <button class="block" id="login-submit">Log in</button>
    </form>

    <form id="signup-form" class="hidden" novalidate>
      <div class="field">
        <label for="signup-username">Username</label>
        <input id="signup-username" autocomplete="username">
        <div class="hint bad" id="signup-username-hint"></div>
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" autocomplete="new-password">
        <div class="hint bad" id="signup-password-hint"></div>
      </div>
      <div class="field">
        <label for="signup-confirm">Confirm password</label>
        <input id="signup-confirm" type="password" autocomplete="new-password">
        <div class="hint bad" id="signup-confirm-hint"></div>
      </div>
      <button class="block" id="signup-submit">Create account</button>
    </form>
  </div>
</main>

<script src="/static/api.js"></script>
<script src="/static/login.js"></script>
</body>
</html>
