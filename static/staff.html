<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collab Pickup Staff</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/staff">Collab Pickup<span>Staff</span></a>
  <div class="nav-user">
    <strong id="who-name"></strong>
    <button class="secondary small" id="logout">Log out</button>
  </div>
</header>

<main class="page">
  <div id="result" class="hidden"></div>

  <div class="two-col">
    <section class="card">
      <div class="section-head">
        <h2>Inventory</h2>
        <button class="secondary small" id="refresh">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Item</th><th>Type</th><th class="num">Price</th><th class="num">Limit</th>
                <th class="num">On sale</th><th class="num">Gifts</th></tr>
          </thead>
          <tbody id="inventory"></tbody>
        </table>
      </div>
    </section>

    <div class="stack">
      <section class="card">
        <h2>Add a release batch</h2>
        <form id="batch-form" class="form">
          <div class="field">
            <label for="batch-item">Item</label>
            <select id="batch-item" required></select>
          </div>
          <div class="field">
            <label for="batch-release">Release at</label>
            <input id="batch-release" type="datetime-local" required>
          </div>
          <div class="field">
            <label for="batch-quantity">Quantity</label>
            <input id="batch-quantity" type="number" min="1" max="1000" value="5" required>
          </div>
          <button class="block">Add batch</button>
        </form>
      </section>

      <section class="card">
        <h2>Add bonus gifts</h2>
        <form id="gifts-form" class="form">
          <div class="field">
            <label for="gifts-combo">Combo</label>
            <select id="gifts-combo" required></select>
          </div>
          <div class="field">
            <label for="gifts-quantity">Quantity</label>
            <input id="gifts-quantity" type="number" min="1" max="1000" value="5" required>
          </div>
          <button class="block">Add gifts</button>
        </form>
      </section>
    </div>
  </div>

  <div class="two-col even">
    <section class="card">
      <h2>New item</h2>
      <form id="item-form" class="form">
        <div class="field">
          <label for="item-name">Name</label>
          <input id="item-name" maxlength="80" required>
        </div>
        <div class="field">
          <label for="item-id">Item ID</label>
          <input id="item-id" maxlength="64" required>
        </div>
        <div class="field">
          <label for="item-price">Price</label>
          <input id="item-price" inputmode="decimal" required>
        </div>
        <div class="field">
          <label class="check"><input id="item-limited" type="checkbox" checked> Limited</label>
        </div>
        <div class="field">
          <label for="item-limit">Order limit</label>
          <input id="item-limit" type="number" min="1" max="50">
        </div>
        <button class="block">Add item</button>
      </form>
    </section>

    <section class="card">
      <h2>New combo</h2>
      <form id="combo-form" class="form">
        <div class="field">
          <label for="combo-name">Name</label>
          <input id="combo-name" maxlength="80" required>
        </div>
        <div class="field">
          <label for="combo-id">Item ID</label>
          <input id="combo-id" maxlength="64" required>
        </div>
        <div class="field">
          <label for="combo-price">Price</label>
          <input id="combo-price" inputmode="decimal" required>
        </div>
        <div class="field">
          <label>Items</label>
          <div id="components" class="components"></div>
          <button type="button" class="secondary small" id="add-component">+ Add item</button>
        </div>
        <div class="field">
          <label for="combo-gifts">Bonus gifts</label>
          <input id="combo-gifts" type="number" min="0" max="1000" value="0">
        </div>
        <button class="block">Add combo</button>
      </form>
    </section>
  </div>
</main>

<script src="/static/api.js"></script>
<script src="/static/staff.js"></script>
</body>
</html>
