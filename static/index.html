<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collab Pickup test page</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; color: #222; }
  h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; margin-top: 1.6rem; border-bottom: 1px solid #ddd; }
  table { border-collapse: collapse; width: 100%; } td, th { border-bottom: 1px solid #eee; padding: 6px; text-align: left; }
  input[type=number] { width: 4em; } button { margin: 2px; }
  pre { background: #f5f5f5; padding: 8px; overflow-x: auto; font-size: 0.85rem; }
  .ok { color: #1a7f37; } .bad { color: #c62828; } .hidden { display: none; }
</style>
</head>
<body>
<h1>Collab Pickup &mdash; test page</h1>

<section>
  <input id="username" placeholder="username (alice, bob, staff)">
  <input id="password" type="password" placeholder="password">
  <button onclick="login()">Log in</button>
  <span id="who">Not logged in.</span>
</section>

<h2>Menu</h2>
<table>
  <thead><tr><th>Item</th><th>Price</th><th>Available</th><th>Limit / order</th><th>Bonus gift</th><th class="customer">Qty</th></tr></thead>
  <tbody id="menu"></tbody>
</table>
<button onclick="loadMenu()">Refresh menu</button>

<div class="customer hidden">
  <h2>Place order</h2>
  <button onclick="placeOrder(false)">Place order (new Idempotency-Key)</button>
  <button onclick="placeOrder(true)">Send the same request again (same key)</button>

  <h2>My orders</h2>
  <button onclick="loadOrders()">Refresh my orders</button>
  <table>
    <thead><tr><th>Order</th><th>Status</th><th>Total</th><th>Lines</th><th>Bonus</th><th></th></tr></thead>
    <tbody id="orders"></tbody>
  </table>
</div>

<div class="staff hidden">
  <h2>Staff: add a release batch</h2>
  <select id="batchItem"></select>
  <input id="batchTime" type="datetime-local">
  <input id="batchQty" type="number" value="5" min="1">
  <button onclick="addBatch()">Add batch</button>
</div>

<h2>Last response</h2>
<pre id="out">(nothing yet)</pre>

<script>
let token = null;
let lastOrder = null;           // { key, body } of the last order sent

async function call(method, path, body, extraHeaders) {
  const headers = { "Content-Type": "application/json", ...(extraHeaders || {}) };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  const replayed = res.headers.get("Idempotency-Replayed");
  const out = document.getElementById("out");
  out.className = res.ok ? "ok" : "bad";
  out.textContent = `${method} ${path} -> ${res.status}` + (replayed ? "  (Idempotency-Replayed: true)" : "")
                    + "\n" + JSON.stringify(data, null, 2);
  return { ok: res.ok, data };
}

async function login() {
  const r = await call("POST", "/auth/login", {
    username: document.getElementById("username").value,
    password: document.getElementById("password").value });
  if (!r.ok) return;
  token = r.data.accessToken;
  const claims = JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
  document.getElementById("who").textContent = `Logged in as ${claims.sub} (${claims.role})`;
  document.querySelectorAll(".customer").forEach(e => e.classList.toggle("hidden", claims.role !== "customer"));
  document.querySelectorAll(".staff").forEach(e => e.classList.toggle("hidden", claims.role !== "staff"));
  await loadMenu();
  if (claims.role === "customer") await loadOrders();
}

async function loadMenu() {
  const r = await call("GET", "/menu");
  const rows = r.data.items.map(i => `<tr>
      <td>${i.name}<br><small>${i.id}</small></td><td>$${i.price}</td>
      <td>${i.available === null ? "unlimited" : i.available}</td>
      <td>${i.perOrderLimit ?? "-"}</td>
      <td>${i.kind === "combo" ? (i.bonusAvailable ? `yes (${i.bonusRemaining} left)` : "run out") : "-"}</td>
      <td class="customer ${document.querySelector('.customer').classList.contains('hidden') ? 'hidden' : ''}">
        <input type="number" min="0" value="0" data-item="${i.id}"></td></tr>`);
  document.getElementById("menu").innerHTML = rows.join("");
  document.getElementById("batchItem").innerHTML = r.data.items
    .filter(i => i.kind === "single" && i.available !== null)
    .map(i => `<option value="${i.id}">${i.name}</option>`).join("");
}

async function placeOrder(sameKey) {
  if (!sameKey || !lastOrder) {
    const lines = [...document.querySelectorAll("#menu input[data-item]")]
      .filter(e => Number(e.value) > 0)
      .map(e => ({ itemId: e.dataset.item, qty: Number(e.value) }));
    lastOrder = { key: crypto.randomUUID(), body: { lines } };
  }
  await call("POST", "/orders", lastOrder.body, { "Idempotency-Key": lastOrder.key });
  await loadOrders();
  await refreshMenuQuietly();
}

async function loadOrders() {
  const out = document.getElementById("out").textContent;    // keep the order response visible
  const r = await call("GET", "/orders");
  document.getElementById("out").textContent = out;
  document.getElementById("orders").innerHTML = r.data.orders.map(o => `<tr>
      <td><small>${o.orderId}</small></td><td>${o.status}</td><td>$${o.total}</td>
      <td>${o.lines.map(l => `${l.qty} x ${l.itemId}`).join("<br>")}</td>
      <td>${o.bonus.map(b => b.included ? "included" : "run out").join("<br>") || "-"}</td>
      <td>${o.status === "PENDING_PAYMENT" ? `<button onclick="cancelOrder('${o.orderId}')">Cancel</button>` : ""}</td>
    </tr>`).join("");
}

async function cancelOrder(id) {
  await call("POST", `/orders/${id}/cancel`);
  await loadOrders();
  await refreshMenuQuietly();
}

async function refreshMenuQuietly() {
  const out = document.getElementById("out").textContent;
  await loadMenu();
  document.getElementById("out").textContent = out;
}

async function addBatch() {
  const local = document.getElementById("batchTime").value;
  await call("POST", `/items/${document.getElementById("batchItem").value}/batches`, {
    releaseAt: local ? new Date(local).toISOString() : new Date().toISOString(),
    quantity: Number(document.getElementById("batchQty").value) });
  await refreshMenuQuietly();
}

loadMenu();
</script>
</body>
</html>
